name: core

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # AC-19: the core builds with no editor and no game client.
      # This job is release-blocking. It is the only thing that catches a
      # host dependency added from inside an editor.
      - name: Build core alone
        run: dotnet build core/Sim.Core.csproj -c Release

      - name: Tests, shipping configuration
        run: dotnet test core/Tests/Sim.Core.Tests.csproj -c Release
        env:
          SIM_WEALTH_BANDS: 1

      # AC-28: the same suite must pass with a multi-valued second key axis.
      - name: Tests, three wealth bands
        run: dotnet test core/Tests/Sim.Core.Tests.csproj -c Release
        env:
          SIM_WEALTH_BANDS: 3

      # A-11. The accumulator's overflow guard is [Conditional("DEBUG")] and its test is
      # under #if DEBUG, so the release steps above compile both out. Without this step
      # the guard is a comment.
      - name: Tests, debug build
        run: dotnet test core/Tests/Sim.Core.Tests.csproj -c Debug
        env:
          SIM_WEALTH_BANDS: 1

      # NFR-12: the runner prints one hash per tick. The tick is in the hash, so a
      # line repeated is a line that did not come from its own tick.
      - name: Harness, one hash per tick
        shell: pwsh
        run: |
          dotnet build harness/Sim.Harness.csproj -c Release
          $h = @(dotnet run --project harness/Sim.Harness.csproj -c Release --no-build -- --ticks 1000 --seed 1 --hashes)
          if ($LASTEXITCODE -ne 0) { throw "sim exited $LASTEXITCODE" }
          if ($h.Count -ne 1000) { throw "expected 1000 hashes, got $($h.Count)" }
          if (@($h | Where-Object { $_ -cnotmatch '^[0-9a-f]{16}$' }).Count -ne 0) { throw "a line is not a hash" }
          if (@($h | Sort-Object -Unique).Count -ne 1000) { throw "a hash repeats" }

      # SIM-REQ §18, the gate of phase 3: 100k empty ticks, and AC-02 across two runs
      # that share nothing but the seed — two processes, their outputs compared byte for
      # byte. Then the floor under P-01 and P-17: ms per empty tick, from a timed run of 10M
      # ticks net of a run of none. 100k empty ticks take less than the start of the
      # process varies by, and gave a negative figure.
      - name: Gate, 100k empty ticks in two runs
        shell: pwsh
        run: |
          $sim = "harness/bin/Release/net8.0/sim.dll"
          foreach ($run in "a", "b") {
            $p = Start-Process dotnet -ArgumentList "$sim --ticks 100000 --seed 1 --hashes" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "hashes-$run.txt"
            if ($p.ExitCode -ne 0) { throw "run $run exited $($p.ExitCode)" }
          }
          $a = [IO.File]::ReadAllBytes("hashes-a.txt")
          $b = [IO.File]::ReadAllBytes("hashes-b.txt")
          if ($a.Length -ne 100000 * 17) { throw "expected 100000 lines of 17 bytes, got $($a.Length) bytes" }
          if (-not [Linq.Enumerable]::SequenceEqual($a, $b)) { throw "the two runs differ" }
          $ms = foreach ($n in 0, 10000000) {
            $w = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process dotnet -ArgumentList "$sim --ticks $n --seed 1" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "final-$n.txt"
            $w.Stop()
            if ($p.ExitCode -ne 0) { throw "timed run of $n ticks exited $($p.ExitCode)" }
            $w.Elapsed.TotalMilliseconds
          }
          [string]::Format([Globalization.CultureInfo]::InvariantCulture, "ms per empty tick: {0:F6}", ($ms[1] - $ms[0]) / 10000000)
